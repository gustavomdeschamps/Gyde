<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
  <title>Gyde</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b1220; color: #cbd5e1; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
    @media (prefers-color-scheme: light) { body { background: #f6f8fc; color: #334155; } }
    .caixa { display: grid; justify-items: center; gap: 18px; }
    .barra { width: 160px; height: 4px; border-radius: 4px; background: rgba(148, 163, 184, .25); overflow: hidden; }
    .barra::before { content: ''; display: block; width: 40%; height: 100%; border-radius: 4px; background: #3b82f6; animation: ir 1.1s ease-in-out infinite; }
    @keyframes ir { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .barra::before { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div class="caixa" role="status">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#1e3a8a"/>
          <stop offset="1" stop-color="#3b82f6"/>
        </linearGradient>
        <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#93c5fd"/>
          <stop offset="1" stop-color="#ffffff"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#bg)"/>
      <!-- trilha em S, do ponto de partida até a estrela -->
      <path d="M15 50C15 38 31 42 31 31S47 24 46 17" fill="none" stroke="url(#trail)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="15" cy="50" r="4.5" fill="#93c5fd"/>
      <circle cx="15" cy="50" r="1.8" fill="#1e3a8a"/>
      <path d="M46 6Q47.3 14.2 54 15.5Q47.3 16.8 46 25Q44.7 16.8 38 15.5Q44.7 14.2 46 6Z" fill="#fff"/>
    </svg>
    <div>Abrindo o Gyde…</div>
    <div class="barra" aria-hidden="true"></div>
  </div>
</body>
</html>
