<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gyde</title>
  <link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
  <link rel="icon" href="/logo.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Gyde: tutor de programação com IA para quem está começando.">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/skills.css">
  <link rel="stylesheet" href="/src/recursos.css">
  <link rel="stylesheet" href="/src/agente.css">
  <link rel="stylesheet" id="hljs-theme" href="/vendor/hljs/styles/github.min.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="#/" aria-label="Gyde — início">
          <img class="brand-mark" src="/logo.svg" alt="" width="30" height="30">
          <span class="brand-name">Gyde</span>
        </a>
        <button class="icon-btn only-mobile" id="closeSidebar" aria-label="Fechar menu">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <button class="new-chat" id="newChat">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Nova conversa
        <kbd>Ctrl Shift O</kbd>
      </button>
      <nav class="main-nav" aria-label="Seções">
        <a class="nav-item" href="#/" data-nav="chat">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/></svg>
          Conversas
        </a>
        <a class="nav-item" href="#/agente" data-nav="agente">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4"/><path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z"/><path d="M9 12v5"/><path d="M15 12v5"/><path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1"/></svg>
          Forja
        </a>
        <a class="nav-item" href="#/skills" data-nav="skills">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></svg>
          Skills
          <span class="nav-badge" id="skillsBadge"></span>
        </a>
      </nav>
      <label class="search">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        <input id="search" type="search" placeholder="Buscar conversas" autocomplete="off">
      </label>
      <nav class="conv-list" id="convList" aria-label="Conversas"></nav>
      <div class="sidebar-bottom">
        <button class="side-btn" id="openSettings">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
          Configurações
        </button>
        <button class="side-btn" id="toggleTheme">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
          <span id="themeLabel">Tema escuro</span>
        </button>
        <div class="user-row">
          <span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
          <span class="user-info"><b id="userName"></b><small id="userLevel"></small></span>
          <button class="icon-btn" id="logoutBtn" title="Sair" aria-label="Sair da conta">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" data-page="chat">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" aria-label="Abrir menu">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
        </button>
        <div id="topoChatRaiz" style="display:contents"></div>
      </header>

      <div class="banner" id="banner" hidden></div>

      <div id="threadRaiz" style="display:contents"></div>
      <section class="skills" id="skillsView" aria-live="polite"></section>
      <section class="skills" id="agenteView" aria-live="polite"></section>

      <div id="composerRaiz" style="display:contents"></div>
      <div class="footnote">
        <span>O Gyde pode errar. Teste o código antes de usar. Suas conversas ficam só no seu computador.</span>
        <span id="usoChipRaiz"></span>
      </div>
    </main>
  </div>


  <div class="intro" id="intro" hidden>
    <video id="introVideo" data-src="/intro.mp4?v=9" playsinline preload="none"></video>
    <p class="intro-legenda" id="introLegenda" aria-live="polite"></p>
    <p class="intro-som" id="introSom" hidden>Clique em qualquer lugar para ouvir</p>
    <button type="button" class="intro-som-btn" id="introSomBtn" aria-label="Som do vídeo" aria-pressed="true"><svg class="icone onda" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg><svg class="icone mudo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z"/><path d="m16.5 14.5 5-5"/><path d="m16.5 9.5 5 5"/></svg></button>
  </div>
  <div class="gate" id="gate" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
