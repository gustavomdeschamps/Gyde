<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gyde</title>
  <link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
  <link rel="icon" href="/logo.svg?v=3" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Gyde: tutor de programação com IA para quem está começando.">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/skills.css">
  <link rel="stylesheet" href="/src/recursos.css">
  <link rel="stylesheet" href="/src/agente.css">
  <link rel="stylesheet" id="hljs-theme" href="/vendor/hljs/styles/github.min.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="#/" aria-label="Gyde — início">
          <img class="brand-mark" src="/logo.svg" alt="" width="30" height="30">
          <span class="brand-name">Gyde</span>
        </a>
        <button class="icon-btn only-mobile" id="closeSidebar" aria-label="Fechar menu">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Nova conversa
        <kbd>Ctrl Shift O</kbd>
      </button>
      <nav class="main-nav" aria-label="Seções">
        <a class="nav-item" href="#/" data-nav="chat">
          <svg viewBox="0 0 24 24"><path d="M5 18.5V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8.5z"/></svg>
          Conversas
        </a>
        <a class="nav-item" href="#/pratica" data-nav="pratica">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/></svg>
          Prática
          <span class="nav-badge" id="xpBadge"></span>
        </a>
        <a class="nav-item" href="#/agente" data-nav="agente">
          <svg viewBox="0 0 24 24"><path d="M4 6l6 6-6 6M12 19h8"/></svg>
          Forja
        </a>
        <a class="nav-item" href="#/turmas" data-nav="turmas">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.3 3.3-5 6.5-5s5.7 1.7 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .5 3.2 2 3.5 5"/></svg>
          Turmas
        </a>
        <a class="nav-item" href="#/skills" data-nav="skills">
          <svg viewBox="0 0 24 24"><path d="M10 3.5h4v3a2 2 0 1 0 4 0v-3h2.5V9h-3a2 2 0 1 0 0 4h3v7.5H14v-3a2 2 0 1 0-4 0v3H3.5V14h3a2 2 0 1 0 0-4h-3V3.5z"/></svg>
          Skills
          <span class="nav-badge" id="skillsBadge"></span>
        </a>
      </nav>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Buscar conversas" autocomplete="off">
      </label>
      <nav class="conv-list" id="convList" aria-label="Conversas"></nav>
      <div class="sidebar-bottom">
        <button class="side-btn" id="installApp" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>
          Instalar o Gyde como app
        </button>
        <button class="side-btn" id="openSettings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Configurações
        </button>
        <button class="side-btn" id="toggleTheme">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <span id="themeLabel">Tema escuro</span>
        </button>
        <div class="user-row">
          <span class="user-avatar" id="userAvatar" aria-hidden="true"></span>
          <span class="user-info"><b id="userName"></b><small id="userLevel"></small></span>
          <button class="icon-btn" id="logoutBtn" title="Sair" aria-label="Sair da conta">
            <svg viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" data-page="chat">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSidebar" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div id="topoChatRaiz" style="display:contents"></div>
      </header>

      <div class="banner" id="banner" hidden></div>

      <div id="threadRaiz" style="display:contents"></div>

      <section class="skills" id="praticaView" aria-live="polite"></section>
      <section class="skills" id="skillsView" aria-live="polite"></section>
      <section class="skills" id="turmasView" aria-live="polite"></section>
      <section class="skills" id="agenteView" aria-live="polite"></section>

      <div id="composerRaiz" style="display:contents"></div>
      <div class="footnote">
        <span>O Gyde pode errar. Teste o código antes de usar. Suas conversas ficam só no seu computador.</span>
        <span id="usoChipRaiz"></span>
      </div>
    </main>
  </div>


  <div class="intro" id="intro" hidden>
    <video id="introVideo" data-src="/intro.mp4?v=8" playsinline preload="none"></video>
    <p class="intro-legenda" id="introLegenda" aria-live="polite"></p>
    <p class="intro-som" id="introSom" hidden>Clique em qualquer lugar para ouvir</p>
    <button type="button" class="intro-som-btn" id="introSomBtn" aria-label="Som do vídeo" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="onda" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mudo" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  </div>
  <div class="gate" id="gate" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
